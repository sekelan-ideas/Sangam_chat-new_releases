name: Attach APK
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - name: Download and attach APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: sekelan-ideas/Sangam-releases
          APK_URL: https://litter.catbox.moe/80gcjo.apk
        run: |
          set -e
          curl -sL --max-time 240 "$APK_URL" -o Sangam-v2.0.2.apk
          ls -la Sangam-v2.0.2.apk
          sha256sum Sangam-v2.0.2.apk
          cp Sangam-v2.0.2.apk Sangam.apk
          gh release upload v2.0.2 Sangam-v2.0.2.apk Sangam.apk --clobber
          gh release view v2.0.2 --json assets -q '.assets[].name'
