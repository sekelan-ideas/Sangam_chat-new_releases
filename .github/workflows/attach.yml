name: Attach APK
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - name: Download, unzip and attach APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: sekelan-ideas/Sangam-releases
          APK_URL: https://x0.at/SL7m.zip
        run: |
          set -e
          curl -sL --max-time 240 "$APK_URL" -o pack.zip
          unzip -o pack.zip
          ls -la Sangam-v2.2.8.apk
          sha256sum Sangam-v2.2.8.apk
          cp Sangam-v2.2.8.apk Sangam.apk
          gh release upload v2.2.8 Sangam-v2.2.8.apk Sangam.apk --clobber
          gh release view v2.2.8 --json assets -q '.assets[].name'
