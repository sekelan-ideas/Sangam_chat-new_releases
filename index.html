<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sangam</title>
<style>
  body { background:#0E1113; color:#fff; margin:0; height:100vh;
         font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         display:flex; align-items:center; justify-content:center; }
  .box { text-align:center; padding:28px; max-width:420px; }
  h1 { color:#3CB3D6; font-size:22px; margin:0 0 12px; }
  p  { color:#9aa4ad; font-size:14px; line-height:1.6; margin:0; }
  a  { display:inline-block; margin-top:22px; background:#3CB3D6; color:#04181f;
       text-decoration:none; padding:13px 26px; border-radius:26px;
       font-weight:600; font-size:15px; }
</style>
</head>
<body>
  <div class="box">
    <h1>Opening Sangam&hellip;</h1>
    <p>Your email is confirmed. If the app does not open by itself,
       tap the button below.</p>
    <a id="go" href="sangam://auth-callback">Open Sangam</a>
  </div>
<script>
  // Supabase sends the sign-in token after the "?" or "#" of this URL.
  // Keep it, and hand the whole thing to the app.
  var tail = (location.search || "") + (location.hash || "");
  var target = "sangam://auth-callback" + tail;
  document.getElementById("go").href = target;
  window.location.replace(target);
</script>
</body>
</html>
